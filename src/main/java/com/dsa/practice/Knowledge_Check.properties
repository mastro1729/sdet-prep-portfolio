# Excel + Apache POI
$ What does FileInputStream provide to Apache POI when opening an Excel file?
$ FileInputStream provides a raw stream of bytes (fis) from the Excel file.

$ What happens when Apache POI parses the stream into a Workbook?
$ Apache POI parses/converts the raw stream of bytes and 
$ Builds an in-memory structured object (Workbook) with Sheet, Row, Cell.

$ Why do we close the FileInputStream once the workbook is created?
$ Once parsed, the Workbook has its own internal memory representation, so the fis is no longer needed. 
$ Closing frees the file handle.

# Cells and MissingCellPolicy
$ What would row.getCell(j) return if the cell is empty and no policy is set?
$ It returns null.

$ How does Row.MissingCellPolicy.CREATE_NULL_AS_BLANK change this behavior?
$ It ensures you get a dummy blank cell object instead of null, avoiding NullPointerException.

$ Can you explain why this is conceptually similar to map.getOrDefault()?
$ Key exists: actual value.
$ Key missing: default value (safe alternative).

# Data storage
$ Why is Object[][] data = null; declared at the start of getTestData()?
$ It's initialized outside so it can be returned after the try block. 
$ Inside the try, the variable would not be visible outside.

$ Why is i - 1 used when storing data into the array from row i?
$ It's because the first row in Excel is usually headers (index 0). 
$ So we skip headers and start storing actual data from row 1, which maps to data[0].

# Resource handling
$ What is the main benefit of using try-with-resources for FileInputStream and Workbook?
$ It automatically closes resources (prevents memory leaks, file locks, resource exhaustion).

$ Name at least three other Java resources (besides FileInputStream) that must be closed after use.
$ BufferedReader, Workbook, Socket, Connection
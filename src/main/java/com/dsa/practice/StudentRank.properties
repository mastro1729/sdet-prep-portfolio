# Problem Statement: Student Rank

# You are required to implement a class StudentRank 
# that manages a list of students and their corresponding ranks.

# Requirements:
$ Implement a class StudentRank with:

# Member Variables
$ students: a String[] array containing student names.
$ ranks: an int[] array containing corresponding student ranks.

# Constructor
$ StudentRank(String[] students, int[] ranks) -- Initializes both arrays.

# Methods
String highestRank() ::: Returns the name of the student with the highest rank (largest rank value).
String lowestRank() ::: Returns the name of the student with the lowest rank (smallest rank value).
 
 # Constraints
$ Each student has a unique rank.
$ 1 <= number of students <= 1000
$ Student names contain only letters (no special characters).
$ Ranks are positive integers.

# Input Format
$ The first line contains comma-separated student names.
$ The second line contains comma-separated integer ranks.

# Output Format
$ Print the name of the student with the highest rank, 
$ followed by the student with the lowest rank, separated by a comma.

# Sample Test Cases
# Example 1
# Input
$ Taylor, Wesley, Jordan
$ 1,5,3

# Output
$ Wesley,Taylor

# Explanation:
$ Wesley has the highest rank (5).
$ Taylor has the lowest rank (1).

# Example 2
# Input
$ Alex, Chris, Sen
$ 3,1,2

$ Output
$ Alex,Chris

# Explanation:
$ Alex has the highest rank (3).
$ Chris has the lowest rank (1).
# Problem Statement: OnlineAccount

# You are required to create a class Account 
# models a user's subscription for an online movie platform..

# Requirements:
$ The Account class must:::
$ Implement the OnlineAccount interface
$ Implement the Comparable<Account> interface to allow sorting based on subscription cost

# Interface: OnlineAccount
$ This interface contains fixed pricing constants:
	
	interface OnlineAccount {
    int basePrice = 120;
    int regularMoviePrice = 45;
    int exclusiveMoviePrice = 80;
	}
	
# Attributes:
$ String ownerName
$ int noOfRegularMovies
$ int noOfExclusiveMovies

# Constructor
$ Initializes ownerName, noOfRegularMovies, and noOfExclusiveMovies.

# Methods
1. monthlyCost()
$ Calculates and returns the monthly cost using the formula:
	monthlyCost = basePrice + (noOfRegularMovies × regularMoviePrice)
                                                 + (noOfExclusiveMovies × exclusiveMoviePrice)
2. compareTo(Account other)
$ Compares two Account objects based on their monthlyCost() value.
3. toString()
$ Returns a formatted string:
	Owner is <ownerName> and monthly cost is <monthlyCost> USD.

# Input Format
$ The first line contains an integer n, the number of accounts.
$ Each of the next n lines contains space-separated values in the following order:
$ ownerName noOfRegularMovies and noOfExclusiveMovies

# Output Format
$ Print the text:
	Most valuable account details:
	Owner is <ownerName> and monthly cost is <monthlyCost> USD.
$ <ownerName> is the name of the account holder with the highest monthly cost.
$ <monthlyCost> is the calculated monthly cost for that account.
 
# Sample Test Cases
# Example 1
# Input
$ 3
$ Frank 12 6
$ David 7 19
$ Karen 14 4

# Explanation:
$ Each line after the count represents:
$ <ownerName> <numberOfRegularMovies> <numberOfExclusiveMovies>

# Output
$ Most valuable account details:
$ Owner is David and monthly cost is 1955 USD.

# Explanation:
$ Let's compute monthly costs:
$ Frank:  120 + (12×45) + (6×80) = 1140
$ David:  120 + (7×45) + (19×80) = 1955
$ Karen:  120 + (14×45) + (4×80) = 1070
$ David has the highest cost ::: so he is the most valuable account.